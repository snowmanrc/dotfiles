
[window]

dimensions = { columns = 80, lines = 26}
padding = { x = 20, y = 20 }
opacity = 0.8

dynamic_title = true 

[font]
normal = { family = "Iosevka", style = "Regular"}
size = 13


[cursor]
style = { shape = "underline", blinking = "On" }

[keyboard]
bindings = [
    { key ="c", mods = "Control", mode = "AppCursor", action = "Copy" },
    { key ="v", mods = "Control", mode = "AppCursor", action = "Paste" },
]

[colors]

[colors.primary]
foreground = "#fcf9f8"
background = "#111111"

[colors.normal]
red     = "#FF5555"
yellow  = "#FFFF55"
green   = "#55FF55"
cyan    = "#55FFFF"
blue    = "#5555FF"
magenta = "#FF55FF"
white   = "#FFFFFF"
black   = "#555555"

[colors.bright]
red     = "#FF7777"
yellow  = "#FFFF77"
green   = "#77FF77"
cyan    = "#77FFFF"
blue    = "#7777FF"
magenta = "#FF77FF"
white   = "#FFFFFF"
black   = "#777777"
