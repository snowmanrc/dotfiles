[accessibility]
ui_scale = 1.2500000111758709

[audio]
enable_screenshot_sounds = false

[bar]
order = [ "main" ]

    [bar.main]
    center = [ "workspaces" ]
    end = [
        "widget",
        "screenshot",
        "wallpaper",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "session"
    ]
    margin_edge = 8
    margin_ends = 8
    padding = 23
    position = "bottom"
    radius = 18
    scale = 1.2000000104308128
    shadow = false
    start = [ "launcher", "clock", "media" ]
    thickness = 52
    widget_spacing = 16

        [bar.main.dead_zone.actions]
        left = "panel-toggle control-center home"

[battery]
warning_threshold = 15

[brightness]
minimum_brightness = 0.099999997764825821
sync_all_monitors = true

[control_center]
hidden_tabs = [ "screen-time" ]
sidebar = "full"
sidebar_section = "full"
width = 750

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "notification"

[desktop_widgets]
enabled = false

[hot_corners]
delay_ms = 350
enabled = true

    [hot_corners.bottom_left]
    action = "window_switcher"

    [hot_corners.bottom_right]
    action = "window_switcher"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend", "Screen Dim" ]
pre_action_fade_seconds = 0

    [idle.behavior."Screen Dim"]
    action = "command"
    command = "noctalia msg brightness-set 50"
    enabled = false
    resume_command = "noctalia msg brightness-set 100"
    timeout = 10.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Lahore, Pakistan"

[lockscreen]
