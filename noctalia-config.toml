[nightlight]
enabled = true

[notification]
background_opacity = 0.99999997764825821
border_color = "surface_container"
follow_focused_output = true
position = "bottom_right"

[osd]
background_opacity = 0.79999998211860657
border_color = "surface_container"
offset_x = 1
offset_y = 25
scale = 1.1500000096857548

[plugin_settings."oldirtty/color_picker"]
lowercase-hex = true
panel_placement = "attached"

[plugins]
enabled = [ "oldirtty/color_picker" ]

[shell]
avatar_path = "/home/snowmanrc/Pictures/snow.png"
button_borders = false
card_borders = false
corner_radius_scale = 2.0
font_family = "Iosevka"
input_borders = false
panel_anchor_bar = "main"
password_style = "random"
polkit_agent = true
popup_borders = false
show_close_buttons = false

    [shell.animation]
    speed = 0.65000000968575478

    [shell.launcher]
    category_icons_only = true
    default_view = "all"
    fetch_exchange_rates = false
    show_navigation_labels = false
    sort_by_usage = false
    track_usage = false

    [shell.panel]
    border_color = "primary"
    border_width = 2.0
    borders = false
    clipboard_placement = "attached"
    floating_offset = 0
    launcher_placement = "attached"
    polkit_placement = "attached"
    session_position = "center"
    transparency_mode = "soft"
    wallpaper_position = "center"

    [shell.screen_corners]
    enabled = true
    size = 42

    [shell.screenshot]
    confirm_region = true
    directory = "/home/snowmanrc/Pictures/Screenshots"

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 3.0
        enabled = true
        label = "Suspend"
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "command"
        command = "systemctl hibernate"
        countdown_seconds = 3.0
        enabled = true
        label = "Hibernate"
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "5"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "6"
        variant = "default"

    [shell.shadow]
    direction = "down_right"

    [shell.window_switcher]
    show_all_outputs = false

[theme]
builtin = "Noctalia"
community_palette = "Spiderman"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

[wallpaper]
directory = "/home/snowmanrc/Pictures/Wallpapers"
transition = [ "melt" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/snowmanrc/Pictures/Wallpapers/andre-benz-qi2hmCwlhcE-unsplash.jpg"

    [wallpaper.last]
    path = "/home/snowmanrc/Pictures/Wallpapers/andre-benz-qi2hmCwlhcE-unsplash.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/snowmanrc/Pictures/Wallpapers/andre-benz-qi2hmCwlhcE-unsplash.jpg"

[widget.clock]
font_scale = 0.97999999999999998
format = "{:%I:%M %p - %d %b - %A} "

[widget.launcher]
